services:
  - type: web
    name: vcsoy-results
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # --timeout 120 : marge de sécurité pour les opérations synchrones les
    # plus lourdes (validation de gros fichiers Excel, génération de
    # rapports PPTX). La génération de scénarios par IA tourne en
    # arrière-plan (voir app/scenarios/routes.py, _run_generation) et ne
    # dépend donc plus de ce timeout, aussi longue soit-elle.
    # --max-requests 3 --max-requests-jitter 1 : sur le plan gratuit (peu de
    # mémoire), un worker gunicorn qui enchaîne plusieurs générations de
    # rapports d'étude (modèle .pptx volumineux, ~44 diapositives) peut ne
    # jamais rendre à l'OS la mémoire momentanément utilisée — observé en
    # pratique dès le 3e rapport. On force donc un redémarrage très
    # fréquent du worker (mémoire remise à zéro), sans jamais couper une
    # requête en cours : le coût (redémarrage plus fréquent) est minime
    # comparé au risque de plantage mémoire.
    startCommand: "gunicorn wsgi:app --timeout 120 --max-requests 3 --max-requests-jitter 1"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vcsoy-results-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ALLOW_DEV_LOGIN
        value: "0"
      - key: SESSION_COOKIE_SECURE
        value: "1"

databases:
  - name: vcsoy-results-db
    plan: free
